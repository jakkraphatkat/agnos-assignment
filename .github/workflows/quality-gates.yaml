name: Quality Gates

on:
  pull_request:
    branches:
      - develop
      - uat
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ matrix.app }}

      - name: Setup GO
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ${{ matrix.app }}
          args: ./...

      - name: Unit tests
        if: always()
        working-directory: ./${{ matrix.app }}
        run: go test ./...

      - name: Depcheck
        if: always()
        uses: dependency-check/Dependency-Check_Action@1.1.0
        id: depcheck
        env:
          # actions/setup-java updates JAVA_HOME on the runner; depcheck action expects container JAVA_HOME.
          JAVA_HOME: /opt/jdk
        with:
          project: go-dem
          path: ./${{ matrix.app }}
          format: HTML
          others: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload Depcheck report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-odc-reports
          path: ./reports

name: CI/CD

on:
  push:
    branches:
      - develop
      - uat
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ matrix.app }}

      - name: Login to Docker Hub (mock)
        run: |
          echo "[MOCK] docker login -u *** -p ***"

      - name: Set up QEMU (mock)
        run: |
          echo "[MOCK] docker run --privileged --rm tonistiigi/binfmt --install all"

      - name: Set up Docker Buildx (mock)
        run: |
          echo "[MOCK] docker buildx create --use"

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "tag=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            echo "tag=uat" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (mock)
        run: |
          echo "[MOCK] docker build -t rywj/${{ matrix.app }}:${{ steps.image-tag.outputs.tag }} ./${{ matrix.app }}"
          echo "[MOCK] docker tag rywj/${{ matrix.app }}:${{ steps.image-tag.outputs.tag }} rywj/${{ matrix.app }}:${{ github.sha }}"
          echo "[MOCK] docker push rywj/${{ matrix.app }}:${{ steps.image-tag.outputs.tag }}"
          echo "[MOCK] docker push rywj/${{ matrix.app }}:${{ github.sha }}"

  cd:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: k8s

      - name: Check environment
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "namespace=agnos-prod" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            echo "env=uat" >> "$GITHUB_OUTPUT"
            echo "namespace=agnos-uat" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "namespace=agnos-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create app secret (dev) (mock)
        if: steps.env.outputs.env == 'dev'
        env:
          NAMESPACE: ${{ steps.env.outputs.namespace }}
          MINIO_ACCESS_KEY: ${{ secrets.DEV_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.DEV_MINIO_SECRET_KEY }}
        run: |
          echo "[MOCK] kubectl -n \"$NAMESPACE\" create secret generic agnos-app-secrets --from-literal=MINIO_ACCESS_KEY=*** --from-literal=MINIO_SECRET_KEY=*** --dry-run=client -o yaml | kubectl apply -f -"

      - name: Create app secret (uat) (mock)
        if: steps.env.outputs.env == 'uat'
        env:
          NAMESPACE: ${{ steps.env.outputs.namespace }}
          MINIO_ACCESS_KEY: ${{ secrets.UAT_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.UAT_MINIO_SECRET_KEY }}
        run: |
          echo "[MOCK] kubectl -n \"$NAMESPACE\" create secret generic agnos-app-secrets --from-literal=MINIO_ACCESS_KEY=*** --from-literal=MINIO_SECRET_KEY=*** --dry-run=client -o yaml | kubectl apply -f -"

      - name: Create app secret (prod) (mock)
        if: steps.env.outputs.env == 'prod'
        env:
          NAMESPACE: ${{ steps.env.outputs.namespace }}
          MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
        run: |
          echo "[MOCK] kubectl -n \"$NAMESPACE\" create secret generic agnos-app-secrets --from-literal=MINIO_ACCESS_KEY=*** --from-literal=MINIO_SECRET_KEY=*** --dry-run=client -o yaml | kubectl apply -f -"

      - name: Deployment to Kube (mock)
        run: |
          echo "[MOCK] kubectl apply -k ./k8s/overlays/${{ steps.env.outputs.env }}"

      - name: Verify rollout (mock)
        env:
          NAMESPACE: ${{ steps.env.outputs.namespace }}
        run: |
          echo "[MOCK] kubectl -n \"$NAMESPACE\" rollout status deployment/backend --timeout=180s"
          echo "[MOCK] kubectl -n \"$NAMESPACE\" rollout status deployment/worker --timeout=180s"
          echo "[MOCK] kubectl -n \"$NAMESPACE\" rollout status deployment/minio --timeout=180s"
